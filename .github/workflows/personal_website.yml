# personal_website をサイトのルートに、group_website を /group/ 以下に配置し、
# 一つの GitHub Pages artifact としてデプロイします。

name: Deploy personal and group websites to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages へのデプロイは常に一つずつ実行します。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            personal_website/package-lock.json
            group_website/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            personal_website/.next/cache
            group_website/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('personal_website/package-lock.json', 'group_website/package-lock.json') }}-${{ hashFiles('personal_website/**', 'group_website/**', 'site_data/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('personal_website/package-lock.json', 'group_website/package-lock.json') }}-

      - name: Install personal website dependencies
        working-directory: ./personal_website
        run: npm ci

      - name: Build personal website
        working-directory: ./personal_website
        run: npx --no-install next build

      - name: Install group website dependencies
        working-directory: ./group_website
        run: npm ci

      - name: Build group website for /group/
        working-directory: ./group_website
        env:
          NEXT_PUBLIC_GROUP_BASE_PATH: /group
          NEXT_PUBLIC_GROUP_PUBLIC_URL: https://k-yamamoto-phys.github.io/group
        run: npx --no-install next build

      - name: Compose GitHub Pages artifact
        run: |
          rm -rf pages-artifact
          mkdir -p pages-artifact/group
          cp -a personal_website/out/. pages-artifact/
          cp -a group_website/out/. pages-artifact/group/
          touch pages-artifact/.nojekyll

          test -f pages-artifact/index.html
          test -f pages-artifact/group/index.html
          test -d pages-artifact/group/_next

      - name: Check composed site
        run: |
          ./personal_website/node_modules/.bin/serve pages-artifact -l 3000 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://localhost:3000/ >/dev/null && \
               curl -fsS http://localhost:3000/group/ >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            if [ "$i" -eq 30 ]; then
              cat server.log
              exit 1
            fi
            sleep 1
          done

          ./personal_website/node_modules/.bin/linkinator http://localhost:3000 \
            --recurse \
            --timeout 15000 \
            --verbosity error \
            || true

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-logs
          path: server.log

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
