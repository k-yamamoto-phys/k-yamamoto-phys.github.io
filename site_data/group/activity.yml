- date: "2026-08-31"
  label: invited talk
  content:
    ja: >
      山本講師が[非エルミート重力物理学ワークショップ](https://indico.rcnp.osaka-u.ac.jp/event/2883/) - 東京都立大学 で招待講演を行います。
    en: >
      Prof. Yamamoto is going to give an invited talk in [Workshop on non-Hermitian gravitational physics](https://indico.rcnp.osaka-u.ac.jp/event/2883/) - Tokyo Metropolitan University, Japan
- date: "2026-07-28"
  label: publication
  content:
    ja: >
      原著論文 "Anomalous waiting-time distributions in postselection-free quantum many-body dynamics under continuous monitoring" が [Quantum Science and Technology誌](https://doi.org/10.1088/2058-9565/ae9183)
      に受理されました。
    en: >
      Original paper "Anomalous waiting-time distributions in postselection-free quantum many-body dynamics under continuous monitoring" has been accepted for publication in [Quantum Science and Technology](https://doi.org/10.1088/2058-9565/ae9183)
- date: "2026-07-23"
  label: publication
  content:
    ja: >
      原著論文 Measurement-Induced Crossover of Quantum Jump Statistics in Postselection-Free
      Many-Body Dynamics が [Physical Review Letters 誌](https://doi.org/10.1103/wv5b-r6sb)に出版されました。
    en: >
      Original paper "Measurement-Induced Crossover of Quantum Jump Statistics
      in Postselection-Free Many-Body Dynamics" has been published in [Physical Review Letters](https://doi.org/10.1103/wv5b-r6sb)
- date: "2026-07-14"
  label: publication
  content:
    ja: >
      原著論文 Kondo breakdown induced by non-Hermitian complex hybridization が [Physical Review B](https://journals.aps.org/prb/abstract/10.1103/w6zs-kb6m)
      誌に出版されました 。
    en: >
      Original paper "Kondo breakdown induced by non-Hermitian complex hybridization" has been published in [Physical
      Review B](https://journals.aps.org/prb/abstract/10.1103/w6zs-kb6m)

- date: "2026-07-09"
  label: event
  content:
    ja: >
      共同研究者の鄭 従真さん（大阪大D3）が研究室に来訪しました。
    en: >
      Our collaborator, Jushin tei, visited in our laboratory.
- date: [2026-07-06, 2026-7-17]
  label: event
  content:
    ja: >
      研究協力者の松原虎之介さん、竹森颯真さん、藤井淳太朗さん（東京科学大）が研究室に滞在しました。
    en: >
      Our research collaborator, Toranosuke Matsubara, Soma Takemori, and Juntaro Fujii stayed in our laboratory.
- date: "2026-07-04"
  label: publication
  content:
    ja: >
      原著論文 "Measurement-induced spatially nonuniform fluctuations of the local particle number and their crossover in a quasiperiodic free-fermion chain" を [arXiv](https://arxiv.org/abs/2607.03799)
      に投稿しました 。
    en: >
      Original paper "Measurement-induced spatially nonuniform fluctuations of the local particle number and their crossover in a quasiperiodic free-fermion chain" has appeared on [arXiv](https://arxiv.org/abs/2607.03799)
- date: "2026-05-13"
  label: award
  content:
    ja: >
      山本講師が[第39回 安藤博記念学術奨励賞](https://www.ando-lab.or.jp/index.html)を受賞しました。
    en: >
      Prof. Kazuki Yamamoto has received [39th Ando Incentive Prize for the Study of Electronics](https://www.ando-lab.or.jp/index.html)
- date: [2026-05-25, 2026-06-05]
  label: event
  content:
    ja: >
      研究協力者の松原虎之介さん、竹森颯真さん、藤井淳太朗さん（東京科学大）が研究室に滞在しました。
    en: >
      Our research collaborator, Toranosuke Matsubara, Soma Takemori, and Juntaro Fujii stayed in our laboratory.
- date: "2026-04-02"
  label: publication
  content:
    ja: >
      原著論文 "Nonequilibrium phase transition of dissipative fermionic superfluids: Case study of multi-terminal Josephson junctions" を [arXiv](https://arxiv.org/abs/2604.00574)
      に投稿しました 。
    en: >
      Original paper "Nonequilibrium phase transition of dissipative fermionic superfluids: Case study of multi-terminal Josephson junctions" has appeared on [arXiv](https://arxiv.org/abs/2604.00574)
- date: "2026-04-01"
  label: event
  content:
    ja: >
      新4回生の小森麟太郎さん、辻利将さんがメンバーに加わりました。
    en: >
      Rintaro Komori and Toshimasa Tsuji have joined as an undergraduate student.
- date: "2026-04-01"
  label: other
  content:
    ja: >
      山本講師が大阪公立大学理学研究科に着任して研究室([非平衡量子多体物性理論](https://www.omu.ac.jp/sci/phys/kouza/condensedmatter.html))を立ち上げました。
    en: >
      Prof. Kazuki Yamamoto has started a new group in [Osaka Metropolitan University](https://www.omu.ac.jp/sci/phys_en/research/condensedmatter.html).
