- title: 
    ja: 原子検出回数の異常ゆらぎと普遍性の発見～測定記録から量子多体物理を読み出す新指標を提案～
    en: Discovery of Anomalous Fluctuations and Universality in Atom-Detection Counts: A New Indicator for Probing Quantum Many-Body Physics through Measurement Records
  date: 2026-07-27 # TBAの場合は表示されないようになる。
  from:
    ja: 大阪公立大学 / 理化学研究所
    en: Osaka Metropolitan University / RIKEN
  url:
    ja: https://www.omu.ac.jp/info/research_news/entry-25211.html
    en: https://www.omu.ac.jp/info/research_news/entry-25211.html
  figure: 
    ja: /images/press_releases/PressReleasePicture_ja.png
    en: /images/press_releases/PressReleasePicture_en.png
  introduction: 
    ja: |
      近年、量子情報や AMO 物理、統計物理などの幅広い分野において、観測の反作用によって誘起されたダイナミクスの研究が盛んに行われており、観測誘起エンタングルメント相転移などの新奇な現象が報告されています。我々は、量子スピン系で測定結果の揺らぎのダイナミクスを理論的に追いかけることで、全系のダイナミクスは自明であるにもかかわらず、内部系の揺らぎには、測定に誘起された非自明な多体効果が現れることを明らかにしました。また、これが典型的な量子多体スピン模型においてパラメータによらず現れることを示し、新たな普遍性の存在を示唆する結果を得ました。特に、測定結果の揺らぎはポストセレクションが不要であり、実験的に低コストで実現可能なことも示しました。
    en: |
      In recent years, quantum phenomena induced by measurements such as entanglement transitions have attracted growing interest across several fields, including quantum information science, AMO physics, and statistical physics. We have demonstrated that, although the fluctuation for the whole system are trivial, nontrivial measurement-induced many-body effects emerge in subsystem fluctuations. We have further shown that this behavior appears independently of model parameters in typical quantum many-body spin models, suggesting the existence of a novel universality. Notably, fluctuations of measurement outcomes do not require postselection, making them experimentally accessible at very low cost.
- title: 
    ja: 非エルミート系での例外点と強相関物理の融合
    en: Discovery of a new superfluid phase in non-Hermitian quantum systems
  date: 2026-12-25
  from:
    ja: 東京科学大学
    en: Institute of Science Tokyo
  url:
    ja: https://www.isct.ac.jp/ja/news/2cc77j8aqtxa
    en: https://www.isct.ac.jp/en/news/eryh7s2mh3vv
  figure: 
    ja: /images/press_releases/sd_image.png
    en: /images/press_releases/sd_image.png
  introduction: 
    ja: |
      近年、粒子の損失や非対称な移動を伴う系を記述する非エルミート系において、例外点と呼ばれる領域で起きる、特異な物理現象に注目が集っています。我々は、フェルミ粒子の持つスピンの種類によって移動する向きが異なる「スピン対破壊効果」と呼ばれる散逸に着目し、この散逸を導入した超流動を理論的に調べた結果、散逸が例外点を誘起し、従来とは全く異なる性質を持つ超流動が形成されることを明らかにしました。
    en: |
      In recent years, unusual physical phenomena occurring near exceptional points in non-Hermitian systems—systems characterized by particle loss or asymmetric transport—have attracted increasing attention. We theoretically investigated a superfluid subject to a dissipative process known as the "spin-pair-breaking effect," in which the direction of motion of fermions depends on their spin state. Our results reveal that this dissipation induces exceptional points and gives rise to a fundamentally new type of superfluid with properties entirely distinct from those of conventional superfluids.
